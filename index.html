<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sfoglia le pagine di Rai Televideo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Televideo">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css?v=13">
  <script src="script.js?v=10" defer></script>
  <title>Televideo</title>
</head>
<body>
  <main>
    <div id="screen" aria-label="Pagina Televideo" aria-busy="true">
      <img id="screen-img" alt="" width="644" height="400" hidden>
      <div id="screen-feedback">
        <p id="screen-status" role="status" aria-live="polite">Caricamento…</p>
        <button id="retry" type="button" hidden>Riprova</button>
      </div>
    </div>
    <form id="page-form" aria-label="Comandi Televideo" novalidate>
      <div class="controls">
        <div class="control-group">
          <label for="channel">Pagina</label>
          <div class="stepper">
            <button id="prevChannel" type="button" aria-label="Pagina precedente">‹</button>
            <input id="channel" name="channel" type="text" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" value="100" autocomplete="off" enterkeyhint="go" aria-describedby="form-error">
            <button id="nextChannel" type="button" aria-label="Pagina successiva">›</button>
          </div>
        </div>
        <div class="control-group">
          <label for="page">Sottopagina</label>
          <div class="stepper">
            <button id="prevPage" type="button" aria-label="Sottopagina precedente">−</button>
            <input id="page" name="page" type="text" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" value="1" autocomplete="off" enterkeyhint="go" aria-describedby="form-error">
            <button id="nextPage" type="button" aria-label="Sottopagina successiva">+</button>
          </div>
        </div>
        <button id="go" type="submit" aria-label="Vai alla pagina o ricarica">Vai</button>
      </div>
      <p id="form-error" role="alert" hidden></p>
    </form>
    <noscript>Attiva JavaScript per visualizzare il Televideo.</noscript>
  </main>
</body>
</html>
